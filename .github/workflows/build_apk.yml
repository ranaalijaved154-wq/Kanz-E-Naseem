name: Build Kanz-e-Naseem Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Scaffolding and Configure Build
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.kanzenaseem --project-name kanz_e_naseem
          
          # Python script to safely configure android/app/build.gradle and AndroidManifest.xml
          python3 -c "
          import re

          # 1. Update android/app/build.gradle
          bg_path = 'android/app/build.gradle'
          with open(bg_path, 'r') as f:
              bg = f.read()

          # Replace minSdkVersion or minSdk cleanly with 21
          bg = re.sub(r'minSdk(Version)?\s*=\s*flutter\.minSdk(Version)?', 'minSdk = 21', bg)
          
          # Ensure multiDexEnabled is true for Firebase
          if 'multiDexEnabled' not in bg:
              bg = bg.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')

          with open(bg_path, 'w') as f:
              f.write(bg)

          # 2. Update android/app/src/main/AndroidManifest.xml
          mf_path = 'android/app/src/main/AndroidManifest.xml'
          with open(mf_path, 'r') as f:
              mf = f.read()

          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n'''
          if '<application' in mf:
              mf = mf.replace('<application', perms + '    <application')
              mf = mf.replace('android:label=\"kanz_e_naseem\"', 'android:label=\"کنزِ نسیم\"')

          with open(mf_path, 'w') as f:
              f.write(mf)
              
          print('Successfully configured Android build.gradle and AndroidManifest.xml')
          "

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kanz-e-Naseem-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
