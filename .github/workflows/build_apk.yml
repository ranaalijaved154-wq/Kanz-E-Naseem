name: Build Kanz-e-Naseem Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Scaffolding and Gradle Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.kanzenaseem --project-name kanz_e_naseem
          
          # Set minSdk to 21 in android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true

          # Inject permissions and Urdu app title
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n'''
          if '<application' in c:
              c = c.replace('<application', perms + '    <application')
              c = c.replace('android:label=\"kanz_e_naseem\"', 'android:label=\"کنزِ نسیم\"')
          with open(p, 'w') as f:
              f.write(c)
          "

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kanz-e-Naseem-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
